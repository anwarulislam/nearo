name: Nearo beta release

on:
  push:
    branches: [beta]

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and verify both Mac packages
        run: ./scripts/release.sh --beta "$GITHUB_RUN_NUMBER"

      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="beta-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cd dist
          shasum -a 256 -c SHA256SUMS-*.txt
          assets=(Nearo-*.dmg Nearo-*.zip SHA256SUMS-*.txt)

          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              echo "$tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Nearo Beta $GITHUB_RUN_NUMBER" --draft --prerelease \
              --notes "Built from beta commit $GITHUB_SHA. Download the DMG for your Mac."
          fi
          gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
