# Load after existing virtual hosts so their default site stays first.
<VirtualHost *:80>
    ServerName nearo.local
    ProxyRequests Off
    ProxyPreserveHost On
    <Location "/">
        Require ip 127.0.0.1 ::1
    </Location>
    ProxyPass "/" "http://127.0.0.1:8765/" connectiontimeout=2 disablereuse=On
    ProxyPassReverse "/" "http://127.0.0.1:8765/"
</VirtualHost>
